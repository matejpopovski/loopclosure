[workspace]
resolver = "2"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Matej Popovski"]
repository = "https://github.com/matejpopovski/loopclosure"

[workspace.lints.clippy]
needless_range_loop = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.test]
opt-level = 2
