[package]
name = "loopclosure-cli"
description = "Command line front end and experiments for the loopclosure SLAM library"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "loopclosure"
path = "src/main.rs"

[dependencies]
loopclosure = { path = "../core" }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
png = "0.17"
serde_json = "1"
